<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연장근로수당 계산기 | 내돈계산</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><article class="page wide-page"><span class="eyebrow">야근·연장근로</span><h1>연장근로수당 계산기</h1><p>통상시급과 연장근로시간을 입력해 예상 수당을 계산합니다.</p><div class="calculator-grid"><div class="form-panel"><label>통상시급<div class="input-unit"><input id="rate" type="number" value="15000"><span>원</span></div></label><label>연장근로시간<div class="input-unit"><input id="hours" type="number" value="10"><span>시간</span></div></label><label>계산 배율<select id="multi"><option value="1.5">1.5배</option><option value="2">2.0배</option></select></label><button class="calc-btn" onclick="calc()">수당 계산</button></div><div class="result-panel center-result"><span>예상 연장근로수당</span><div class="mega" id="out">0원</div></div></div><p><a href="calculators.html">← 전체 계산기</a></p></article></main><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){out.textContent=w(Math.max(0,+rate.value||0)*Math.max(0,+hours.value||0)*(+multi.value||1.5))}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
