<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통상임금·통상시급 계산기 | 내돈계산</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="calculators.html">계산기</a><a href="guide.html">가이드</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">통상임금 간편 계산</span><h1>통상임금·통상시급 계산기</h1><p>기본급과 정기 수당, 정기상여를 월 단위로 환산해 통상시급과 연차·연장근로수당을 간편 추정합니다.</p><div class="calculator-grid"><div class="form-panel"><label>월 기본급<div class="input-unit"><input id="owBase" type="number" value="3000000"><span>원</span></div></label><label>매월 정기 수당<div class="input-unit"><input id="owAllowance" type="number" value="300000"><span>원</span></div></label><label>연간 정기상여<div class="input-unit"><input id="owAnnualBonus" type="number" value="0"><span>원/년</span></div></label><label>월 산정 기준시간<div class="input-unit"><input id="owHours" type="number" value="209"><span>시간</span></div></label><label>미사용 연차<div class="input-unit"><input id="owLeaveDays" type="number" value="8"><span>일</span></div></label><label>연장근로<div class="input-unit"><input id="owOverHours" type="number" value="10"><span>시간</span></div></label><button class="calc-btn" onclick="calcOrdinary()">계산하기</button></div><div class="result-panel"><div class="result-line"><span>월 통상임금 추정</span><strong id="owMonthly">0원</strong></div><div class="result-total"><span>통상시급 추정</span><strong id="owHourly">0원</strong></div><div class="result-line"><span>1일 통상임금</span><strong id="owDaily">0원</strong></div><div class="result-line"><span>연차수당</span><strong id="owLeavePay">0원</strong></div><div class="result-line"><span>연장근로수당</span><strong id="owOverPay">0원</strong></div></div></div><p class="small">개별 임금항목의 통상임금 포함 여부는 지급조건에 따라 달라질 수 있습니다.</p></article></main><script>const won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원';const val=id=>Math.max(0,Number(document.getElementById(id).value)||0);function calcOrdinary(){const m=val('owBase')+val('owAllowance')+val('owAnnualBonus')/12,h=Math.max(1,val('owHours')),hr=m/h,d=hr*8;owMonthly.textContent=won(m);owHourly.textContent=won(hr);owDaily.textContent=won(d);owLeavePay.textContent=won(d*val('owLeaveDays'));owOverPay.textContent=won(hr*1.5*val('owOverHours'))}window.addEventListener('DOMContentLoaded',calcOrdinary)</script></body></html>
