<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퇴직금 계산기 2026 | 내돈계산</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><article class="page wide-page"><span class="eyebrow">퇴사 준비</span><h1>퇴직금 계산기</h1><p>입사일, 퇴사일, 퇴직 전 3개월 임금총액으로 예상 퇴직금을 간편 계산합니다.</p><div class="calculator-grid"><div class="form-panel"><label>입사일<input id="s" class="date-input" type="date" value="2022-01-01"></label><label>퇴사일<input id="e" class="date-input" type="date" value="2026-08-24"></label><label>퇴직 전 3개월 임금총액<div class="input-unit"><input id="w" type="number" value="10500000"><span>원</span></div></label><label>해당 3개월 총일수<div class="input-unit"><input id="d" type="number" value="92"><span>일</span></div></label><button class="calc-btn" onclick="calc()">퇴직금 계산</button></div><div class="result-panel"><div class="result-line"><span>재직일수</span><strong id="service">0일</strong></div><div class="result-line"><span>1일 평균임금</span><strong id="avg">0원</strong></div><div class="result-total"><span>예상 퇴직금</span><strong id="out">0원</strong></div></div></div><p class="small">참고용 추정치이며 실제 산정은 개별 근로조건에 따라 달라질 수 있습니다.</p><p><a href="calculators.html">← 전체 계산기</a></p></article></main><script>const won=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){const S=new Date(s.value),E=new Date(e.value),days=E>=S?Math.floor((E-S)/86400000)+1:0,av=(+w.value||0)/Math.max(1,+d.value||1),sev=days>=365?av*30*(days/365):0;service.textContent=days.toLocaleString('ko-KR')+'일';avg.textContent=won(av);out.textContent=days>=365?won(sev):'계속근로 1년 미만'}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
