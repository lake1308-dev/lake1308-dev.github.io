<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 연봉·월급 실수령액 계산기 | 내돈계산</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><article class="page wide-page"><span class="eyebrow">2026 급여 계산</span><h1>연봉·월급 실수령액 계산기</h1><p>연봉, 비과세액, 월 소득세를 입력해 사회보험료와 예상 월 실수령액을 계산합니다.</p><div class="calculator-grid"><div class="form-panel"><label>연봉<div class="input-unit"><input id="annual" type="number" value="42000000"><span>원</span></div></label><label>월 비과세액<div class="input-unit"><input id="nontax" type="number" value="200000"><span>원</span></div></label><label>월 소득세<div class="input-unit"><input id="incomeTax" type="number" value="0"><span>원</span></div></label><button class="calc-btn" onclick="calc()">실수령액 계산</button></div><div class="result-panel"><div class="result-line"><span>월 세전급여</span><strong id="gross">0원</strong></div><div class="result-line"><span>국민연금</span><strong id="pension">0원</strong></div><div class="result-line"><span>건강보험</span><strong id="health">0원</strong></div><div class="result-line"><span>장기요양</span><strong id="care">0원</strong></div><div class="result-line"><span>고용보험</span><strong id="employment">0원</strong></div><div class="result-line"><span>소득세+지방소득세</span><strong id="tax">0원</strong></div><div class="result-total"><span>예상 월 실수령액</span><strong id="net">0원</strong></div></div></div><p><a href="calculators.html">← 전체 계산기</a></p></article></main><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){let a=Math.max(0,+annual.value||0),g=a/12,nt=Math.max(0,+nontax.value||0),b=Math.max(0,g-nt),pb=b===0?0:Math.min(6590000,Math.max(410000,b)),p=pb*.0475,h=b*.03595,c=h*.1314,e=b*.009,it=Math.max(0,+incomeTax.value||0),lt=it*.1,total=p+h+c+e+it+lt;gross.textContent=w(g);pension.textContent=w(p);health.textContent=w(h);care.textContent=w(c);employment.textContent=w(e);tax.textContent=w(it+lt);net.textContent=w(Math.max(0,g-total))}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
