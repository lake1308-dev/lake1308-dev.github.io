<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주휴수당 계산기 2026 | 내돈계산</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><article class="page wide-page"><span class="eyebrow">아르바이트·직장인</span><h1>주휴수당 계산기</h1><p>시급과 주 소정근로시간을 입력해 예상 주휴수당을 계산합니다.</p><div class="calculator-grid"><div class="form-panel"><label>시급<div class="input-unit"><input id="rate" type="number" value="10320"><span>원</span></div></label><label>주 소정근로시간<div class="input-unit"><input id="hours" type="number" value="20"><span>시간</span></div></label><button class="calc-btn" onclick="calc()">주휴수당 계산</button></div><div class="result-panel"><div class="result-line"><span>주휴시간</span><strong id="rest">0시간</strong></div><div class="result-total"><span>예상 주휴수당</span><strong id="pay">0원</strong></div></div></div><h2>간편 계산식</h2><p>주 15시간 이상이면 최대 주 40시간 범위에서 (주 소정근로시간 ÷ 40) × 8시간 × 시급으로 계산합니다.</p><p><a href="calculators.html">← 전체 계산기</a></p></article></main><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){const r=Math.max(0,+rate.value||0),h=Math.min(40,Math.max(0,+hours.value||0)),rh=h>=15?h/40*8:0;rest.textContent=rh.toFixed(1)+'시간';pay.textContent=w(r*rh)}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
